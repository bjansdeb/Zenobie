[General]
debug = True
log_level = info
median_path = 200
max_path = 240

[Dezipper]
max_files = 1_000
max_total_size = 1_000_000_000
authorized_packs = {".zip", ".tar", ".7z"}
unauthorized_packs = {".rar"}
mimes_niv_1 = {"
    'application/gzip',
    'application/x-gzip',
    'application/x-bzip2',
    'application/x-xz',
    'application/zstd',
    'application/x-lz4',
    'application/x-compress',
    "}

[Renamer]
forbidden_chars = [\@\]\[\^\<\>\:"'\{\}\/\|\?\* -]

